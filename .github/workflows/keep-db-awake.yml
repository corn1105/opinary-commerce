name: Keep database awake

# Supabase's free plan pauses a project after 7 days of low activity, which
# takes the whole site down (widgets, poll API, admin). This job touches the
# database once a day through the live site's /health/db endpoint.
# If the database is unreachable, the job fails and GitHub emails the repo owner.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {} # "Run workflow" button, for manual checks

permissions:
  actions: write # lets the last step keep this scheduled job switched on
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database through the live site
        run: |
          curl --fail --silent --show-error --max-time 30 \
               --retry 3 --retry-delay 30 --retry-all-errors \
               https://opinary-commerce-production.up.railway.app/health/db

      # GitHub disables scheduled workflows in public repos after 60 days with
      # no repo activity. Re-enabling via the API (a no-op when already on)
      # resets that clock, so the job doesn't silently stop on a quiet repo.
      - name: Keep this scheduled job switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/keep-db-awake.yml/enable"
